name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Version bumped when skills/ changed
        # The local pre-commit hook only runs where core.hooksPath is set; this catches every other clone.
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to compare against"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" HEAD)  # an unreadable base fails the step here, not silently below
          [[ $'\n'"$changed" == *$'\n'skills/* ]] || { echo "skills/ unchanged"; exit 0; }  # no pipe or temp file to fail
          ver() { python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])'; }
          old=$(git show "$BEFORE:.claude-plugin/plugin.json" | ver)
          new=$(ver < .claude-plugin/plugin.json)
          if [ "$old" = "$new" ]; then
            echo "::error file=.claude-plugin/plugin.json::skills/ changed but version is still $old; claude plugin update will copy nothing"
            exit 1
          fi
          echo "version $old -> $new"

      - name: Grader self-test
        run: bash tests/test-graders.sh

      - name: Version hook test
        run: bash tests/test-version-hook.sh

      - name: Section references resolve
        run: bash tests/test-section-refs.sh

      - name: scan.py finds planted tells
        run: bash tests/test-scan.sh

      - name: doc_check.py finds planted document defects
        run: bash tests/test-doc-check.sh

      - name: voice_stats.py measures samples and drafts
        run: bash tests/test-voice.sh

      - name: pua_fix.py maps Thai PUA glyphs
        run: bash tests/test-pua.sh

      - name: pua_pdf.py repairs a PDF end to end
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet pikepdf
          bash tests/test-pua-pdf.sh
